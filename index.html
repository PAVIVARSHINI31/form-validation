<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beautiful Form Validation</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1e3a8a);
    }

    .container{
      width:450px;
      background:#fff;
      padding:30px;
      border-radius:15px;
      box-shadow:0 10px 25px rgba(0,0,0,0.3);
    }

    .container h2{
      text-align:center;
      margin-bottom:25px;
      color:#1e3a8a;
    }

    .input-box{
      margin-bottom:20px;
      position:relative;
    }

    .input-box label{
      display:block;
      margin-bottom:6px;
      font-weight:bold;
      color:#333;
    }

    .input-box input,
    .input-box textarea{
      width:100%;
      padding:12px;
      border:2px solid #ccc;
      border-radius:8px;
      outline:none;
      transition:0.3s;
      font-size:15px;
    }

    .input-box textarea{
      resize:none;
      height:90px;
    }

    .input-box input:focus,
    .input-box textarea:focus{
      border-color:#2563eb;
    }

    .icon{
      position:absolute;
      right:12px;
      top:40px;
      color:green;
      display:none;
      font-size:18px;
    }

    small{
      color:red;
      display:none;
      margin-top:5px;
    }

    .success input,
    .success textarea{
      border-color:green;
    }

    .success .icon{
      display:block;
    }

    .error input,
    .error textarea{
      border-color:red;
    }

    .error small{
      display:block;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      background:#2563eb;
      color:#fff;
      font-size:16px;
      border-radius:8px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#1d4ed8;
    }
  </style>
</head>
<body>

  <div class="container">
    <form id="form">

      <h2>Contact Form</h2>

      <div class="input-box">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name">
        <span class="icon">✔</span>
        <small>Error</small>
      </div>

      <div class="input-box">
        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter 10 digit number" maxlength="10">
        <span class="icon">✔</span>
        <small>Error</small>
      </div>

      <div class="input-box">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email">
        <span class="icon">✔</span>
        <small>Error</small>
      </div>

      <div class="input-box">
        <label>Your Message</label>
        <textarea id="message" placeholder="Type your message"></textarea>
        <span class="icon">✔</span>
        <small>Error</small>
      </div>

      <button type="submit">Submit</button>

    </form>
  </div>

  <script>
    const form = document.getElementById("form");

    form.addEventListener("submit", function(e){
      e.preventDefault();

      validateInput("name", "Name is required");
      validatePhone();
      validateEmail();
      validateInput("message", "Message is required");
    });

    function validateInput(id, msg){
      const input = document.getElementById(id);
      const parent = input.parentElement;

      if(input.value.trim() === ""){
        parent.classList.add("error");
        parent.classList.remove("success");
        parent.querySelector("small").innerText = msg;
      } else {
        parent.classList.add("success");
        parent.classList.remove("error");
      }
    }

    function validatePhone(){
      const phone = document.getElementById("phone");
      const parent = phone.parentElement;

      const pattern = /^[0-9]{10}$/;

      if(!phone.value.match(pattern)){
        parent.classList.add("error");
        parent.classList.remove("success");
        parent.querySelector("small").innerText =
          "Phone number must be 10 digits";
      } else {
        parent.classList.add("success");
        parent.classList.remove("error");
      }
    }

    function validateEmail(){
      const email = document.getElementById("email");
      const parent = email.parentElement;

      const pattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

      if(!email.value.match(pattern)){
        parent.classList.add("error");
        parent.classList.remove("success");
        parent.querySelector("small").innerText =
          "Enter valid email";
      } else {
        parent.classList.add("success");
        parent.classList.remove("error");
      }
    }
  </script>

</body>
</html>
